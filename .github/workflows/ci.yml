# Runs the clone-all.sh test and its recorded mutations, so a reviewer reads the result here.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Mutation data file checks
        run: scripts/test-mutations-data.sh
      - name: Clone test and its mutations
        run: scripts/test-clone-all-mutations.sh
