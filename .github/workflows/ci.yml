# Runs the clone-all.sh test and its recorded mutations, so a reviewer reads the result here.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Mutation data file checks
        run: scripts/test-mutations-data.sh
      - name: Mutation gate for the runner
        run: scripts/test-runner-mutations.sh
      - name: Golden matching runner data file checks
        run: scripts/test-golden-mutations-data.sh
      - name: Mutation gate for the golden matching runner
        run: scripts/test-runner-mutations.sh test-golden-matching-mutations.sh test-golden-mutations-data.sh golden-runner-mutations.txt
      - name: Clone test and its mutations
        run: scripts/test-clone-all-mutations.sh

  # Hashing to decrypted output, against the expected files in tests/golden-hashing/.
  # linkja-matching decrypts the hash file. The repos are checked out side by
  # side, the layout that clone-all.sh makes.
  golden-hashing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: linkja-workspace
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: MRAIA-ORG/linkja-crypto
          ref: develop
          path: linkja-crypto
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: MRAIA-ORG/linkja-hashing
          ref: develop
          path: linkja-hashing
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: MRAIA-ORG/linkja-matching
          ref: develop
          path: linkja-matching
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: MRAIA-ORG/linkja-test-data
          path: linkja-test-data
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install OpenSSL 3 and CMake
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake
      - name: Golden test of hashing
        run: linkja-workspace/scripts/test-golden-hashing.sh

  # Matching on two sites, against the expected files in tests/golden-matching/.
  # Then the recorded mutations of that test script.
  golden-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: linkja-workspace
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: MRAIA-ORG/linkja-matching
          ref: develop
          path: linkja-matching
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Golden test of matching
        run: linkja-workspace/scripts/test-golden-matching.sh
      - name: Mutations of the golden matching test
        run: linkja-workspace/scripts/test-golden-matching-mutations.sh
